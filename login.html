<!DOCTYPE html>
<html lang="fr">
<head>

<link rel="manifest" href="manifest.json">
  
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Connexion | FiDesign</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, sans-serif;
}

body{
background:#000;
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
overflow:hidden;
}

.background{
position:absolute;
width:100%;
height:100%;
background:
linear-gradient(rgba(0,0,0,0.7),rgba(0,0,0,0.8)),
url('assets/images/PHOTO FIDEL1.png');
background-size:cover;
background-position:center;
filter:blur(2px);
}

.login-box{
position:relative;
z-index:2;
width:400px;
background:#111;
padding:40px;
border-radius:20px;
border:1px solid #222;
box-shadow:0 0 30px rgba(255,215,0,0.2);
}

.logo{
text-align:center;
margin-bottom:20px;
}

.logo h1{
color:gold;
font-size:40px;
}

.logo p{
color:#aaa;
font-size:14px;
}

.input-box{
margin-top:20px;
}

.input-box input{
width:100%;
padding:15px;
background:#1a1a1a;
border:none;
outline:none;
border-radius:10px;
color:white;
font-size:15px;
}

.btn{
margin-top:25px;
width:100%;
padding:15px;
border:none;
border-radius:10px;
background:gold;
color:black;
font-weight:bold;
cursor:pointer;
font-size:16px;
transition:0.3s;
}

.btn:hover{
transform:scale(1.03);
}

.footer{
margin-top:20px;
text-align:center;
font-size:13px;
color:#888;
}

.error{
margin-top:15px;
color:red;
text-align:center;
display:none;
}

</style>
</head>

<body>

<div class="background"></div>

<div class="login-box">

<div class="logo">
<h1>FiDesign</h1>
<p>Espace Étudiant Premium</p>
</div>

<div class="input-box">
<input type="email" id="email" placeholder="Votre email">
</div>

<div class="input-box">
<input type="password" id="password" placeholder="Votre mot de passe">
</div>

<button class="btn" onclick="login()">
Se connecter
</button>

<div class="error" id="error">
Email ou mot de passe incorrect
</div>

<div class="footer">
© 2026 FiDesign — Tous droits réservés
</div>

</div>

<script type="module">

import { initializeApp }

from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {

getAuth,
signInWithEmailAndPassword,
onAuthStateChanged,
signOut

}

from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {

apiKey: "AIzaSyBqLVJ9V3Wxlz8tn_XoCcQSH9RDLeSzCDQ",

authDomain: "fidesign-b4ffa.firebaseapp.com",

projectId: "fidesign-b4ffa",

storageBucket: "fidesign-b4ffa.firebasestorage.app",

messagingSenderId: "307432077161",

appId: "1:307432077161:web:b714f7dc213618bac5aff8",

measurementId: "G-05M3T1HX42"

};

const app =
initializeApp(firebaseConfig);

const auth =
getAuth(app);

window.login = function(){

let email =
document.getElementById("email").value;

let password =
document.getElementById("password").value;

signInWithEmailAndPassword(

auth,
email,
password

)

.then((userCredential)=>{

localStorage.setItem(
"fidesignUser",
"connected"
);

window.location.href =
"dashboard.html";

})

.catch((error)=>{

document.getElementById(
"error"
).style.display = "block";

console.log(error);

});

}

</script>

</body>
</html>
