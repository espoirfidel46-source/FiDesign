<!DOCTYPE html>
<html lang="fr">

<head>  

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Inscription | FiDesign</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{

background:#000;
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
overflow:hidden;

}

.background{

position:absolute;
width:100%;
height:100%;

background:
linear-gradient(
rgba(0,0,0,0.75),
rgba(0,0,0,0.85)
),

url('assets/images/PHOTO FIDEL1.png');

background-size:cover;
background-position:center;
filter:blur(3px);

}

.register-box{

position:relative;
z-index:2;
width:420px;

background:
rgba(20,20,20,0.95);

padding:40px;

border-radius:25px;

border:
1px solid rgba(255,215,0,0.2);

box-shadow:
0 0 35px rgba(255,215,0,0.15);

}

.logo{

text-align:center;
margin-bottom:25px;

}

.logo h1{

color:gold;
font-size:42px;

}

.logo p{

color:#aaa;
font-size:14px;

}

.input-box{

margin-top:18px;

}

.input-box input{

width:100%;
padding:16px;

background:#1a1a1a;

border:none;
outline:none;

border-radius:12px;

color:white;
font-size:15px;

}

.btn{

margin-top:25px;

width:100%;
padding:16px;

border:none;

border-radius:12px;

background:gold;
color:black;

font-weight:bold;
font-size:16px;

cursor:pointer;
transition:0.3s;

}

.btn:hover{

transform:scale(1.03);

}

.success{

margin-top:18px;
color:#00ff99;
text-align:center;
display:none;

}

.error{

margin-top:18px;
color:red;
text-align:center;
display:none;

}

.footer{

margin-top:20px;
text-align:center;
font-size:13px;
color:#888;

}

a{

color:gold;
text-decoration:none;

}

</style>

<link rel="manifest" href="manifest.json">
  
</head>

<body>

<div class="background"></div>

<div class="register-box">

<div class="logo">

<h1>FiDesign</h1>

<p>Créer un compte étudiant</p>

</div>

<div class="input-box">

<input
type="text"
id="name"
placeholder="Nom complet">

</div>

<div class="input-box">

<input
type="email"
id="email"
placeholder="Votre email">

</div>

<div class="input-box">

<input
type="password"
id="password"
placeholder="Mot de passe">

</div>

<button class="btn"
onclick="register()">

Créer mon compte

</button>

<div class="success"
id="success">

Compte créé avec succès ✅

</div>

<div class="error"
id="error">

</div>

<div class="footer">

Déjà inscrit ?

<a href="login.html">

Se connecter

</a>

</div>

</div>

<script type="module">

import { initializeApp }

from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {

getAuth,
createUserWithEmailAndPassword

}
  
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {

getFirestore,
doc,
setDoc

}

from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
  
const firebaseConfig = {

apiKey: "AIzaSyBqLVJ9V3Wxlz8tn_XoCcQSH9RDLeSzCDQ",

authDomain: "fidesign-b4ffa.firebaseapp.com",

projectId: "fidesign-b4ffa",

storageBucket: "fidesign-b4ffa.firebasestorage.app",

messagingSenderId: "307432077161",

appId: "1:307432077161:web:b714f7dc213618bac5aff8",

measurementId: "G-05M3T1HX42"

};

const app =
initializeApp(firebaseConfig);

const auth =
getAuth(app);

 const db =
getFirestore(app); 

window.register = function(){
  
document.getElementById("error").style.display = "none";
  
document.getElementById("success").style.display = "none";

let email =
document.getElementById("email")
.value
.trim();

let password =
document.getElementById("password").value;

let name =
document.getElementById("name")
.value
.trim();

const emailPattern =
/^[^\s@]+@[^\s@]+\.[^\s@]+$/;

if(!emailPattern.test(email)){

const errorBox =
document.getElementById("error");

errorBox.style.display =
"block";

errorBox.innerText =
"⚠ Format email invalide";

return;

}  
  
if(
name === "" ||
email === "" ||
password === ""
){

const errorBox =
document.getElementById("error");

errorBox.style.display =
"block";

errorBox.innerText =
"⚠ Veuillez remplir tous les champs";

return;

} 

createUserWithEmailAndPassword(

auth,
email,
password

)

.then(async(userCredential)=>{

try{

let user = userCredential.user;

localStorage.setItem(
"studentName",
name
);
  
await setDoc(

doc(db,"students",user.uid),

{

name:name,

email:email,

premium:false,

progression:0,

createdAt:new Date().toISOString()

}

);

document.getElementById(
"success"
).style.display = "block";

setTimeout(()=>{

window.location.href =
"login.html";

},2000);

}
catch(error){

console.log(error);

document.getElementById(
"error"
).style.display = "block";

}

})
.catch((error)=>{

console.log(error);

let message =
"Erreur lors de l'inscription";

if(
error.code ===
"auth/email-already-in-use"
){

message =
"⚠ Cet email possède déjà un compte";

}

if(
error.code ===
"auth/weak-password"
){

message =
"⚠ Mot de passe trop faible";

}

if(
error.code ===
"auth/invalid-email"
){

message =
"⚠ Adresse email invalide";

}

const errorBox =
document.getElementById("error");

errorBox.style.display =
"block";

errorBox.innerText =
message;

});
}

if(password.length < 8){

const errorBox =
document.getElementById("error");

errorBox.style.display =
"block";

errorBox.innerText =
"⚠ Mot de passe minimum 8 caractères";

return;

}

if(name.length < 3){

const errorBox =
document.getElementById("error");

errorBox.style.display =
"block";

errorBox.innerText =
"⚠ Nom trop court";

return;

}  
  
</script>

</body>
</html>
