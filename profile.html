<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Profil Étudiant | FiDesign</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{

background:#000;
color:white;

padding:40px;

}

.container{

max-width:900px;
margin:auto;

}

.card{

background:#111;

border:
1px solid rgba(255,215,0,0.15);

border-radius:25px;

padding:40px;

box-shadow:
0 0 30px rgba(255,215,0,0.08);

}

.header{

display:flex;
align-items:center;
gap:25px;

margin-bottom:30px;

}

.avatar{

width:130px;
height:130px;

border-radius:50%;

border:4px solid gold;

object-fit:cover;

}

.name{

font-size:34px;
font-weight:bold;
color:gold;

}

.email{

margin-top:8px;
color:#aaa;

}

.badge{

display:inline-block;

margin-top:12px;

padding:8px 18px;

border-radius:30px;

background:gold;
color:black;

font-weight:bold;

}

.stats{

display:grid;

grid-template-columns:
repeat(auto-fit,minmax(200px,1fr));

gap:20px;

margin-top:40px;

}

.box{

background:#1a1a1a;

padding:25px;

border-radius:20px;

}

.box h3{

color:gold;
margin-bottom:10px;

}

.progress{

margin-top:40px;

}

.progress-bar{

width:100%;
height:18px;

background:#222;

border-radius:30px;

overflow:hidden;

margin-top:12px;

}

.progress-fill{

height:100%;
width:0%;

background:gold;

}

.btn{

display:inline-block;

margin-top:35px;

padding:14px 28px;

background:gold;

color:black;
font-weight:bold;

border-radius:12px;

text-decoration:none;

}

</style>

</head>

<body>

<div class="container">

<div class="card">

<div class="header">

<img
src="assets/images/PHOTO FIDEL1.png"
class="avatar">

<div>

<div
class="name"
id="studentName">

Chargement...

</div>

<div
class="email"
id="studentEmail">

Chargement...

</div>

<div
class="badge"
id="studentBadge">

Étudiant Standard

</div>

</div>

</div>

<div class="stats">

<div class="box">

<h3>Formations</h3>

<p id="formations">

0

</p>

</div>

<div class="box">

<h3>Certificats</h3>

<p id="certificates">

0

</p>

</div>

<div class="box">

<h3>Statut</h3>

<p id="premiumStatus">

Standard

</p>

</div>

</div>

<div class="progress">

<h3>
Progression générale
</h3>

<div class="progress-bar">

<div
class="progress-fill"
id="progressFill">

</div>

</div>

<p
style="margin-top:10px;"
id="progressText">

0%

</p>

</div>

<a
href="dashboard.html"
class="btn">

Retour Dashboard

</a>

</div>

</div>

<script type="module">

import { initializeApp }

from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {

getAuth,
onAuthStateChanged

}

from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {

getFirestore,
doc,
getDoc

}

from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {

apiKey: "AIzaSyBqLVJ9V3Wxlz8tn_XoCcQSH9RDLeSzCDQ",

authDomain: "fidesign-b4ffa.firebaseapp.com",

projectId: "fidesign-b4ffa",

storageBucket: "fidesign-b4ffa.firebasestorage.app",

messagingSenderId: "307432077161",

appId: "1:307432077161:web:b714f7dc213618bac5aff8",

measurementId: "G-05M3T1HX42"

};

const app =
initializeApp(firebaseConfig);

const auth =
getAuth(app);

const db =
getFirestore(app);

onAuthStateChanged(auth, async(user)=>{

if(user){

const docRef =
doc(db,"students",user.uid);

const docSnap =
await getDoc(docRef);

if(docSnap.exists()){

const data =
docSnap.data();

document.getElementById(
"studentName"
).innerText = data.name;

document.getElementById(
"studentEmail"
).innerText = data.email;

document.getElementById(
"progressText"
).innerText =
data.progression + "%";

document.getElementById(
"progressFill"
).style.width =
data.progression + "%";

document.getElementById(
"premiumStatus"
).innerText =

data.premium
? "Premium"
: "Standard";

document.getElementById(
"studentBadge"
).innerText =

data.premium
? "Étudiant Premium"
: "Étudiant Standard";

}

}else{

window.location.href =
"login.html";

}

});

window.uploadImage = async function(){

const file =
document.getElementById(
"imageUpload"
).files[0];

if(!file){

alert("Choisissez une image");

return;

}

const formData =
new FormData();

formData.append(
"file",
file
);

formData.append(
"upload_preset",
"fidesign_preset"
);

const response =
await fetch(

"https://api.cloudinary.com/v1_1/fidesign/image/upload",

{

method:"POST",

body:formData

}

);

const data =
await response.json();

document.getElementById(
"profileImage"
).src = data.secure_url;

alert(
"Photo uploadée avec succès 🚀"
);

}  

</script>

</body>
</html>
