<!DOCTYPE html>
<html lang="fr">

<head>
  
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Admin Panel | FiDesign</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{

background:#0f0f0f;

color:white;

padding:30px;

}

.header{

display:flex;

justify-content:space-between;

align-items:center;

margin-bottom:40px;

}

.logo{

font-size:32px;

font-weight:bold;

color:gold;

}

.logout{

background:red;

border:none;

padding:12px 20px;

border-radius:10px;

color:white;

font-weight:bold;

cursor:pointer;

}

.stats{

display:grid;

grid-template-columns:
repeat(auto-fit,minmax(250px,1fr));

gap:20px;

margin-bottom:40px;

}

.card{

background:#1b1b1b;

padding:30px;

border-radius:20px;

border:1px solid gold;

}

.card h2{

font-size:18px;

color:#aaa;

margin-bottom:15px;

}

.card p{

font-size:35px;

font-weight:bold;

color:gold;

}

.table-container{

background:#1b1b1b;

padding:25px;

border-radius:20px;

overflow:auto;

border:1px solid gold;

}

table{

width:100%;

border-collapse:collapse;

}

th,td{

padding:15px;

text-align:left;

border-bottom:1px solid #333;

}

th{

color:gold;

}

.action-btn{

padding:8px 14px;

border:none;

border-radius:8px;

cursor:pointer;

font-weight:bold;

margin-right:8px;

}

.premium{

background:gold;

color:black;

}

.delete{

background:red;

color:white;

}

</style>

<link rel="manifest" href="manifest.json">
  
</head>

<body>

<div class="header">

<div class="logo">
FiDesign Admin
</div>

<button
class="logout"
onclick="logout()">

Déconnexion

</button>

</div>

<div class="stats">
  
<div class="card">

<h2>Total Étudiants</h2>

<p id="totalStudents">
0
</p>

</div>

<div class="card">

<h2>Comptes Premium</h2>

<p id="premiumStudents">
0
</p>

</div>

<div class="card">

<h2>Progression Moyenne</h2>

<p id="averageProgress">
0%
</p>

</div> 
  </div>

<div class="card">

<h2>📜 Certificats</h2>

<h3><div id="totalCertificates">
Total : 0
</div></h3>

<h3><div id="validCertificates">
Valides : 0
</div></h3>

<h3><div id="revokedCertificates">
Révoqués : 0
</div></h3>

</div>
  
<div class="card">

<h2>📜 Gestion des Certificats</h2>

<h3><div id="certificatesList">
Chargement...
</div></h3>
    
  </div>

<div class="card">

<h2>
Top Étudiants Certifiés
</h2>

<h3><div id="topStudents">
Chargement...
</div></h3>
  
 </div>
  
 </div> 

   </div>
  
 </div> 

<div class="table-container">

<table>

<thead>

<tr>

<th>Nom</th>

<th>Email</th>

<th>Premium</th>

<th>Progression</th>

<th>Actions</th>

</tr>

</thead>

<tbody id="studentsTable">

</tbody>

</table>

</div>

<script type="module">

import { initializeApp }

from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {

getFirestore,
collection,
getDocs,
doc,
updateDoc,
deleteDoc

}

from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {

apiKey: "AIzaSyBqLVJ9V3Wxlz8tn_XoCcQSH9RDLeSzCDQ",

authDomain: "fidesign-b4ffa.firebaseapp.com",

projectId: "fidesign-b4ffa",

storageBucket: "fidesign-b4ffa.firebasestorage.app",

messagingSenderId: "307432077161",

appId: "1:307432077161:web:b714f7dc213618bac5aff8",

measurementId: "G-05M3T1HX42"

};

const app =
initializeApp(firebaseConfig);

const db =
getFirestore(app);

const table =
document.getElementById(
"studentsTable"
);

let total = 0;
let premium = 0;
let progressionTotal = 0;

async function loadStudents(){

const querySnapshot =
await getDocs(
collection(db,"students")
);

table.innerHTML = "";

querySnapshot.forEach((docSnap)=>{

const data =
docSnap.data();

total++;

if(data.premium){
premium++;
}

progressionTotal +=
data.progression || 0;

table.innerHTML += `

<tr>

<td>${data.name}</td>

<td>${data.email}</td>

<td>
${data.premium ? "Oui" : "Non"}
</td>

<td>
${data.progression || 0}%
</td>

<td>

<button
class="action-btn premium"
onclick="makePremium('${docSnap.id}')">

Premium

</button>

<button
class="action-btn delete"
onclick="deleteStudent('${docSnap.id}')">

Supprimer

</button>

</td>

</tr>

`;

});

document.getElementById(
"totalStudents"
).innerText = total;

document.getElementById(
"premiumStudents"
).innerText = premium;

document.getElementById(
"averageProgress"
).innerText =

total > 0

?

Math.round(
progressionTotal / total
) + "%"

:

"0%";

}

window.makePremium =
async function(id){

await updateDoc(

doc(db,"students",id),

{

premium:true

}

);

alert(
"Compte Premium activé 🚀"
);

location.reload();

}

window.deleteStudent =
async function(id){

await deleteDoc(
doc(db,"students",id)
);

alert(
"Étudiant supprimé"
);

location.reload();

}

window.logout = function(){

localStorage.removeItem(
"fidesignUser"
);

window.location.href =
"login.html";

}

loadStudents();  

async function loadCertificateStats(){

const snapshot =
await getDocs(
collection(
db,
"certificates"
)
);

let total = 0;
let valid = 0;
let revoked = 0;

snapshot.forEach((doc)=>{

total++;

const data =
doc.data();

if(data.status === "valid"){

valid++;

}
else{

revoked++;

}

});

document.getElementById(
"totalCertificates"
).innerText =
"Total : " + total;

document.getElementById(
"validCertificates"
).innerText =
"Valides : " + valid;

document.getElementById(
"revokedCertificates"
).innerText =
"Révoqués : " + revoked;

}

loadCertificateStats();

async function loadTopStudents(){

const snapshot =
await getDocs(
collection(
db,
"certificates"
)
);

const ranking = {};

snapshot.forEach((doc)=>{

const cert =
doc.data();

const student =
cert.studentName;

if(!ranking[student]){

ranking[student] = 0;

}

ranking[student]++;

});

const sorted =
Object.entries(ranking)

.sort(
(a,b)=>
b[1]-a[1]
)

.slice(0,5);

let html = "";

sorted.forEach(
(student,index)=>{

html += `
<p>

${index+1}.
${student[0]}

(${student[1]}
certificat${student[1]>1?"s":""})

</p>
`;

});

document.getElementById(
"topStudents"
).innerHTML =
html || "Aucun certificat";

}

loadTopStudents();

async function loadCertificates(){

const snapshot =
await getDocs(
collection(
db,
"certificates"
)
);

let html = "";

snapshot.forEach((certificate)=>{

const data =
certificate.data();

html += `

<div style="
padding:12px;
margin:10px 0;
border:1px solid gold;
border-radius:10px;
">

<b>${data.studentName}</b><br>

${data.certificateId}<br>

Statut :
${data.status}

<br><br>

${data.status === "valid"
?
`
<button
onclick="revokeCertificate('${data.certificateId}')">

🚫 Révoquer

</button>
`
:
`
<button
onclick="activateCertificate('${data.certificateId}')">

✅ Réactiver

</button>
`
}

</div>

`;

});

document.getElementById(
"certificatesList"
).innerHTML =
html;

}

loadCertificates();  

window.revokeCertificate =
async function(certificateId){

const confirmDelete =
confirm(
"Révoquer ce certificat ?"
);

if(!confirmDelete){

return;

}

await updateDoc(

doc(
db,
"certificates",
certificateId
),

{
status:"revoked"
}

);

alert(
"❌ Certificat révoqué"
);

loadCertificates();

loadCertificateStats();

} 

window.activateCertificate =
async function(certificateId){

const confirmActivate =
confirm(
"Réactiver ce certificat ?"
);

if(!confirmActivate){

return;

}

await updateDoc(

doc(
db,
"certificates",
certificateId
),

{
status:"valid"
}

);

alert(
"✅ Certificat réactivé"
);

loadCertificates();

loadCertificateStats();

}  
  
</script>

</body>
</html>
