<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Certificat | FiDesign</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{

background:#000;
padding:40px;

display:flex;
justify-content:center;

}

.certificate{

width:1000px;

background:white;

padding:60px;

border:12px solid gold;

position:relative;

}

.logo{

text-align:center;

font-size:50px;
font-weight:bold;

color:gold;

margin-bottom:20px;

}

.title{

text-align:center;

font-size:38px;

font-weight:bold;

margin-top:20px;

}

.subtitle{

text-align:center;

margin-top:20px;

font-size:20px;

color:#444;

}

.student{

text-align:center;

font-size:42px;

font-weight:bold;

margin-top:40px;

color:#111;

}

.description{

text-align:center;

margin-top:35px;

font-size:22px;

line-height:1.7;

color:#333;

}

.footer{

display:flex;

justify-content:space-between;

margin-top:80px;

}

.signature{

text-align:center;

}

.line{

width:250px;
height:2px;

background:#000;

margin-bottom:10px;

}

.download{

position:fixed;

bottom:30px;
right:30px;

padding:18px 30px;

background:gold;

border:none;

border-radius:12px;

font-size:18px;
font-weight:bold;

cursor:pointer;

}

</style>

</head>

<body>

<div>

<div
class="certificate"
id="certificate">

<div class="logo">

FiDesign

</div>

<div class="title">

CERTIFICAT DE FORMATION

</div>

<div class="subtitle">

Ce certificat est décerné à

</div>

<div
class="student"
id="studentName">

Chargement...

</div>

<div class="description">

Pour avoir suivi avec succès la formation professionnelle proposée par FiDesign Academy.

</div>

<div class="footer">

<div class="signature">

<div class="line"></div>

Espoir Kashindi Fidel

</div>

<div class="signature">

<div class="line"></div>

Direction FiDesign

</div>

</div>

</div>

<button
class="download"
onclick="downloadPDF()">

📄 Télécharger PDF

</button>

</div>

<script>

const studentName =
localStorage.getItem(
"studentName"
);

if(studentName){

document.getElementById(
"studentName"
).innerText =
studentName;

localStorage.setItem(
"studentName",
data.name
);
  
}
  
function downloadPDF(){

const element =
document.getElementById(
"certificate"
);

html2pdf()
.from(element)
.save(
"Certificat_FiDesign.pdf"
);

}

</script>

</body>
</html>
