<!DOCTYPE html>
<html lang="fr">

<head>
  
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Certificat | FiDesign</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Georgia, serif;
}

body{

background:#111;

display:flex;

justify-content:center;

align-items:center;

min-height:100vh;

padding:40px;

}

.certificate{

width:297mm;

height:210mm;

background:white;

position:relative;

padding:60px;

border:15px solid #d4af37;

overflow:hidden;

box-shadow:0 0 40px rgba(0,0,0,0.5);

}

.certificate{
background:white;
padding:60px;
border:12px solid #d4af37;
box-shadow:0 0 40px rgba(0,0,0,0.3);
}
  
.corner{

position:absolute;

width:120px;

height:120px;

border:8px solid #d4af37;

}

.top-left{
top:20px;
left:20px;
border-right:none;
border-bottom:none;
}

.top-right{
top:20px;
right:20px;
border-left:none;
border-bottom:none;
}

.bottom-left{
bottom:20px;
left:20px;
border-right:none;
border-top:none;
}

.bottom-right{
bottom:20px;
right:20px;
border-left:none;
border-top:none;
}

.logo{

text-align:center;

font-size:42px;

font-weight:bold;

color:#d4af37;

margin-top:10px;

}

.title{

text-align:center;

font-size:34px;

font-weight:bold;

margin-top:25px;

letter-spacing:3px;

color:#111;

}

.subtitle{

text-align:center;

margin-top:20px;

font-size:20px;

color:#444;

}

.student-name{

text-align:center;

font-size:40px;

font-weight:bold;

color:#d4af37;

margin-top:35px;

text-transform:uppercase;

}

.student-name{
font-size:42px;
font-weight:bold;
color:#d4af37;
margin:30px 0;
font-family:"Times New Roman", serif;
}
  
.description{

text-align:center;

margin-top:30px;

font-size:20px;

line-height:1.8;

color:#333;

padding:0 60px;

}

.badge{

width:140px;

height:140px;

border-radius:50%;

background:#d4af37;

display:flex;

justify-content:center;

align-items:center;

font-size:22px;

font-weight:bold;

color:white;

position:absolute;

right:60px;

top:50px;

box-shadow:0 0 20px rgba(212,175,55,0.6);

}

.footer{

position:absolute;

bottom:40px;

left:60px;

right:60px;

display:flex;

justify-content:space-between;

align-items:center;

}

.signature{

text-align:center;

}

.signature-line{

width:220px;

height:2px;

background:#111;

margin-bottom:10px;

}

.signature p{

font-size:16px;

font-weight:bold;

}

.date{

text-align:center;

margin-top:25px;

font-size:18px;

color:#555;

}

/* BOUTON TÉLÉCHARGEMENT PREMIUM */

.download{

display:flex;

justify-content:center;

align-items:center;

width:fit-content;

margin:35px auto;

padding:16px 32px;

border:none;

border-radius:18px;

background:
linear-gradient(
135deg,
gold,
#ffcc00
);

color:black;

font-size:18px;

font-weight:700;

cursor:pointer;

transition:0.4s ease;

box-shadow:
0 10px 25px rgba(255,215,0,0.25);

}

/* HOVER */

.download:hover{

transform:
translateY(-4px)
scale(1.03);

box-shadow:
0 15px 35px rgba(255,215,0,0.35);

}

/* MOBILE */

@media(max-width:768px){

.download{

width:100%;

font-size:16px;

padding:18px;

border-radius:16px;

}

}  

</style>

<link rel="manifest" href="manifest.json">
  
</head>

<body>

<div>

<div class="certificate" id="certificate">

<div class="corner top-left"></div>
<div class="corner top-right"></div>
<div class="corner bottom-left"></div>
<div class="corner bottom-right"></div>

<div class="badge">
CERTIFIÉ
</div>

<div class="logo">
FiDesign
</div>

<div class="title">
CERTIFICAT OFFICIEL
</div>

<div class="subtitle">
Ce certificat est décerné à
</div>

<div class="student-name" id="studentName">
Chargement...
</div>

<div class="description">

Pour avoir suivi avec succès la formation professionnelle proposée par FiDesign Academy, et démontré les compétences requises dans le domaine étudié.

</div>

<div class="date" id="date">
Date
</div>

<div class="footer">

<div class="signature">

<div class="signature-line"></div>

<p>Espoir Kashindi Fidel</p>

</div>

<div class="signature">

<div class="signature-line"></div>

<p>Direction FiDesign</p>

</div>

</div>

</div>

<button class="download" onclick="downloadPDF()">📄 Télécharger PDF</button>

</div>
  
<audio id="soundCertificate"
src="assets/sounds/certificate.mp3">

<script>

const studentName = localStorage.getItem("studentName");

if(studentName){

document.getElementById(
"studentName"
).innerText =
studentName || "Étudiant FiDesign";
  
}

// Date automatique
const today = new Date();

document.getElementById("date").innerText =
today.toLocaleDateString("fr-FR");

function downloadPDF(){

const element =
document.getElementById(
"certificate"
);

html2pdf()

.set({

margin:0,

filename:
"Certificat_FiDesign.pdf",

image:{
type:"jpeg",
quality:1
},

html2canvas:{
scale:4,
useCORS:true
},

jsPDF:{

unit:"mm",

format:"a4",

orientation:"landscape"

}

})

.from(element)

.outputPdf("bloburl")

.then((pdfUrl)=>{

window.open(
pdfUrl,
"_blank"
);

showToast(
"📄 Certificat prêt au téléchargement"
);

});

}
</script>

<script>

if(

localStorage.getItem(
"fidesignUser"
)

!==

"connected"

){

window.location.href =
"login.html";

function playCertificate(){

document
.getElementById(
"soundCertificate"
)
.play();

}

</script>

</audio>
  
</body>
</html>
