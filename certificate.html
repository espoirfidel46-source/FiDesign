<!DOCTYPE html>
<html lang="fr">

<head>
  
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Certificat | FiDesign</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Georgia, serif;
}

#qrcode{

position:absolute;

left:60px;

top:60px;

background:white;

padding:8px;

border-radius:10px;

}
  
body{

background:#111;

display:flex;

justify-content:center;

align-items:center;

min-height:100vh;

padding:40px;

}

.certificate{

width:297mm;

height:210mm;

background:white;

position:relative;

padding:60px;

border:15px solid #d4af37;

overflow:hidden;

box-shadow:0 0 40px rgba(0,0,0,0.5);

}

.certificate{
background:white;
padding:60px;
border:12px solid #d4af37;
box-shadow:0 0 40px rgba(0,0,0,0.3);
}
  
.corner{

position:absolute;

width:120px;

height:120px;

border:8px solid #d4af37;

}

.top-left{
top:20px;
left:20px;
border-right:none;
border-bottom:none;
}

.top-right{
top:20px;
right:20px;
border-left:none;
border-bottom:none;
}

.bottom-left{
bottom:20px;
left:20px;
border-right:none;
border-top:none;
}

.bottom-right{
bottom:20px;
right:20px;
border-left:none;
border-top:none;
}

.logo{

text-align:center;

font-size:42px;

font-weight:bold;

color:#d4af37;

margin-top:10px;

}

.title{

text-align:center;

font-size:34px;

font-weight:bold;

margin-top:25px;

letter-spacing:3px;

color:#111;

}

.subtitle{

text-align:center;

margin-top:20px;

font-size:20px;

color:#444;

}

.student-name{

text-align:center;

font-size:40px;

font-weight:bold;

color:#d4af37;

margin-top:35px;

text-transform:uppercase;

}

.student-name{
font-size:42px;
font-weight:bold;
color:#d4af37;
margin:30px 0;
font-family:"Times New Roman", serif;
}
  
.description{

text-align:center;

margin-top:30px;

font-size:20px;

line-height:1.8;

color:#333;

padding:0 60px;

}

.badge{

width:140px;

height:140px;

border-radius:50%;

background:#d4af37;

display:flex;

justify-content:center;

align-items:center;

font-size:22px;

font-weight:bold;

color:white;

position:absolute;

right:60px;

top:50px;

box-shadow:0 0 20px rgba(212,175,55,0.6);

}

.footer{

position:absolute;

bottom:40px;

left:60px;

right:60px;

display:flex;

justify-content:space-between;

align-items:center;

}

.signature{

text-align:center;

}

.signature-line{

width:220px;

height:2px;

background:#111;

margin-bottom:10px;

}

.signature p{

font-size:16px;

font-weight:bold;

}

.date{

text-align:center;

margin-top:25px;

font-size:18px;

color:#555;

}

/* BOUTON STANDARD RESPONSIVE */

.download{

display:flex;

justify-content:center;

align-items:center;

width:100%;

max-width:320px;

margin:35px auto;

padding:16px 24px;

border:none;

border-radius:14px;

background:
linear-gradient(
135deg,
gold,
#ffcc00
);

color:black;

font-size:17px;

font-weight:700;

cursor:pointer;

transition:0.3s ease;

box-shadow:
0 8px 20px rgba(255,215,0,0.25);

}

/* HOVER */

.download:hover{

transform:
translateY(-3px);

box-shadow:
0 12px 28px rgba(255,215,0,0.35);

}

/* MOBILE */

@media(max-width:768px){

.download{

width:100%;

max-width:none;

font-size:16px;

padding:18px;

border-radius:12px;

}

}
  
</style>

<link rel="manifest" href="manifest.json">

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  
</head>

<body>

<div>

<div class="certificate" id="certificate">

<div class="corner top-left"></div>
<div class="corner top-right"></div>
<div class="corner bottom-left"></div>
<div class="corner bottom-right"></div>

<div class="badge">
CERTIFIÉ
</div>

<img
src="assets/images/icon-192.png"
width="120">

<div class="title">
CERTIFICAT OFFICIEL
</div>

<div class="subtitle">
Ce certificat est décerné à
</div>

<div class="student-name" id="studentName">
Chargement...
</div>

<div
class="description"
id="courseCertificate">

Chargement de la formation...

</div>

<div
class="date"
id="certificateGrade">

Niveau : Réussi

</div>  

<div class="date" id="date">
Date
</div>

<div class="date" id="certificateId">

ID : Chargement...

</div> 

<div
class="date"
id="certificateGrade">

Niveau : Réussi

</div>  

<div id="qrcode"></div>
  
<div class="footer">

<div class="signature">

<div class="signature-line"></div>
  
<p>Espoir Kashindi Fidel</p>

</div>

<div class="signature">

<div class="signature-line"></div>

<p>Direction FiDesign</p>

</div>

<button class="download" onclick="downloadPDF()">📄 Télécharger PDF</button>

</div>
  
<audio
id="soundCertificate"
src="assets/sounds/certificate.mp3">
</audio>

<script>

// Date automatique
const certificateDate =
localStorage.getItem("certificateDate");

document.getElementById("date").innerText =
certificateDate || new Date().toLocaleDateString("fr-FR");

let certificateId =
localStorage.getItem(
"certificateId"
);

if(!certificateId){

certificateId =
"FD-" +
Date.now();

localStorage.setItem(
"certificateId",
certificateId
);

}

document.getElementById(
"certificateId"
).innerText =
"ID : " + certificateId;  

const verifyUrl =
window.location.origin +
"/verify.html?id=" +
certificateId;

new QRCode(
document.getElementById("qrcode"),
{
text: verifyUrl,
width: 120,
height: 120
}
);    
  
function downloadPDF(){

document
.getElementById(
"soundCertificate"
)
.play()
.catch(error => console.log(error));

playCertificate();

const element =
document.getElementById(
"certificate"
);

const downloadBtn =
document.querySelector(".download");

/* Cache le bouton */
downloadBtn.style.display = "none";

html2pdf()

.set({

margin:0,

filename:
"Certificat_FiDesign.pdf",

image:{
type:"jpeg",
quality:1
},

html2canvas:{
scale:4,
useCORS:true
},

jsPDF:{

unit:"mm",

format:"a4",

orientation:"landscape"

}

})

.from(element)

.outputPdf("bloburl")

.then((pdfUrl)=>{

window.open(
pdfUrl,
"_blank"
);

showToast(
"📄 Certificat prêt au téléchargement"
);

})

.catch((error)=>{

console.error(error);

})

.finally(()=>{

/* Réaffiche toujours le bouton */
downloadBtn.style.display = "flex";

});

}
  
</script>

<script>

/* SON CERTIFICAT */

function playCertificate(){

document
.getElementById(
"soundCertificate"
)
.play();

}

  
</script>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getAuth,
onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
getFirestore,
doc,
getDoc
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
  
const firebaseConfig = {

apiKey: "AIzaSyBqLVJ9V3Wxlz8tn_XoCcQSH9RDLeSzCDQ",
authDomain: "fidesign-b4ffa.firebaseapp.com",
projectId: "fidesign-b4ffa",
storageBucket: "fidesign-b4ffa.firebasestorage.app",
messagingSenderId: "307432077161",
appId: "1:307432077161:web:b714f7dc213618bac5aff8",
measurementId: "G-05M3T1HX42"

};

const app =
initializeApp(firebaseConfig);

const auth =
getAuth(app);

const db =
getFirestore(app);  

onAuthStateChanged(auth, async(user)=>{

if(!user){

window.location.href =
"login.html";

return;

}  

const docRef =
doc(
db,
"students",
user.uid
);

const docSnap =
await getDoc(docRef);

if(docSnap.exists()){

const data =
docSnap.data();

document.getElementById(
"studentName"
).innerText =
data.name;

const course =
localStorage.getItem(
"courseTitle"
);

document.getElementById(
"courseCertificate"
).innerHTML =
"Pour avoir suivi avec succès la formation professionnelle <b>" +
(course || "FiDesign Academy") +
"</b> et démontré les compétences requises.";  

document.getElementById(
"certificateGrade"
).innerText =
"Niveau : " +
(data.grade || "Réussi");  

}  

});

</script>
  
</body>
</html>
